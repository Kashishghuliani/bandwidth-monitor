
name: Check monitoring targets

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  check-targets:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
      DJANGO_DEBUG: "False"
      DB_ENGINE: postgresql
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Apply database migrations
        run: python manage.py migrate --noinput

      - name: Verify monitoring database tables
        run: |
          python manage.py showmigrations monitor
          python manage.py shell -c "from django.db import connection; print('Database:', connection.settings_dict['NAME']); print('Tables:', [t for t in connection.introspection.table_names() if t.startswith('monitor_')])"

      - name: Check all monitoring targets
        run: python manage.py check_target_ips
